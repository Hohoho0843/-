server:
  port: 8080

spring:
  application:
    name: iot-device-platform
  profiles:
    active: h2

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.iot.platform.entity
  configuration:
    map-underscore-to-camel-case: true

mqtt:
  enabled: true
  broker-url: tcp://localhost:1883
  client-id: iot-platform-server
  username:
  password:
  topic: iot/device/+/data
  qos: 1

iot:
  device-offline-minutes: 5

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:iot_platform;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql

pagehelper:
  helper-dialect: h2
  reasonable: true

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/iot_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root123
  sql:
    init:
      mode: never

pagehelper:
  helper-dialect: mysql
  reasonable: true
