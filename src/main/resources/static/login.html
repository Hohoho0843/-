<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 物联网设备管理平台</title>
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>物联网设备管理平台</h1>
      <p class="subtitle">用户登录</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary">登 录</button>
        <p class="error-msg" id="errorMsg"></p>
      </form>
      <p class="auth-footer">还没有账号？<a href="/register.html">立即注册</a></p>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    if (getCurrentUser()) {
      window.location.href = '/index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const result = loginUser(username, password);
      if (result.success) {
        window.location.href = '/index.html';
      } else {
        document.getElementById('errorMsg').textContent = result.message;
      }
    });
  </script>
</body>
</html>
